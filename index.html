<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petite question...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h2 {
            color: #4a5568;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-yes {
            background-color: #48bb78;
            color: white;
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #f56565;
            color: white;
            position: relative;
        }

        .hidden {
            display: none;
        }

        .success-message {
            color: #2d3748;
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .emoji-laugh {
            font-size: 3rem;
            margin-top: 15px;
            display: block;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ÉTAPE 1 -->
        <div id="step-1" class="step">
            <h2>Veux-tu être grand comme Jared ? 🦒</h2>
            <div class="buttons">
                <button class="btn-yes" onclick="nextStep(2)">Oui</button>
                <button class="btn-no" id="btn-no-1" onmouseover="moveButton('btn-no-1')" onclick="moveButton('btn-no-1')">Non</button>
            </div>
        </div>

        <!-- ÉTAPE 2 -->
        <div id="step-2" class="step hidden">
            <h2>Vas-tu payer pour suivre la formation "comment devenir grand en 20 minutes" de Jared ? 💸</h2>
            <div class="buttons">
                <button class="btn-yes" onclick="nextStep(3)">Oui</button>
                <button class="btn-no" id="btn-no-2" onmouseover="moveButton('btn-no-2')" onclick="moveButton('btn-no-2')">Non</button>
            </div>
        </div>

        <!-- ÉTAPE 3 -->
        <div id="step-3" class="step hidden">
            <h2>Pensez vous que vous êtes grande ? 🧐</h2>
            <div class="buttons">
                <button class="btn-yes" onclick="showLaughAndNext()">Oui</button>
                <button class="btn-no" id="btn-no-3" onmouseover="moveButton('btn-no-3')" onclick="moveButton('btn-no-3')">Non</button>
            </div>
            <span id="laugh-emoji" class="emoji-laugh hidden">😂</span>
        </div>

        <!-- ÉTAPE 4 : Mot de fin -->
        <div id="step-4" class="step hidden">
            <h2>🎉 Terminé !</h2>
            <p class="success-message">Félicitations vous venez de souscrire gratuitement au forfait Jared pour rester court 😂.</p>
        </div>
    </div>

    <script>
        // Fonction pour faire fuir le bouton "Non"
        function moveButton(btnId) {
            const btn = document.getElementById(btnId);
            const x = Math.random() * 200 - 100;
            const y = Math.random() * 100 - 50;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Changer d'étape
        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(el => el.classList.add('hidden'));
            document.getElementById(`step-${stepNumber}`).classList.remove('hidden');
        }

        // Afficher l'emoji rieur à l'étape 3 avant de passer à la fin
        function showLaughAndNext() {
            const emoji = document.getElementById('laugh-emoji');
            emoji.classList.remove('hidden');
            
            // Attendre 1.5 seconde pour qu'elle voie l'emoji avant de passer au mot de fin
            setTimeout(() => {
                nextStep(4);
            }, 1500);
        }
    </script>

</body>
</html>
